name: nuitka build

on:
  push:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which builds to make"
        type: choice
        options: [all, linux]
        default: all
      release_tag:
        description: "Attach the builds to this existing release tag (e.g. v1.1.1); leave empty to just build"
        required: false
        default: ""

concurrency:
  group: nuitka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # pushes build everything; a manual run can pick Linux only
        os: ${{ fromJSON(inputs.platforms == 'linux' && '["ubuntu-latest"]' || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    env:
      SUFFIX: ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'macos' || 'linux') }}
      PKG: ${{ matrix.os == 'windows-latest' && '--onefile --windows-console-mode=attach --enable-plugin=upx --onefile-no-compression --windows-icon-from-ico=holodori_profile_export/assets/favicon.ico' || (matrix.os == 'macos-latest' && '--standalone --macos-create-app-bundle --macos-app-name="holodori exporter" --macos-app-icon=holodori_profile_export/assets/icon.icns' || '--onefile --enable-plugin=upx --onefile-no-compression --linux-icon=holodori_profile_export/assets/icon.png') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install -r requirements.txt

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import holodori_profile_export as m; print(m.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx -y

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Make app icons
        shell: bash
        run: |
          # The artwork is kept as icon.webp to keep the repo small; build the formats each OS needs.
          python - <<'PY'
          from PIL import Image
          d = "holodori_profile_export/assets/"
          im = Image.open(d + "icon.webp").convert("RGBA")
          im.save(d + "icon.png")
          im.save(d + "favicon.ico", sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          PY

      - name: Make app icon (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set=$RUNNER_TEMP/icon.iconset; mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s holodori_profile_export/assets/icon.png --out "$set/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) holodori_profile_export/assets/icon.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o holodori_profile_export/assets/icon.icns

      - name: Build (Nuitka)
        run: >
          python -m nuitka
          --lto=yes
          --python-flag=-O
          --remove-output
          ${{ env.PKG }}
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --output-dir=dist
          --output-filename=holodori-exporter-${{ env.SUFFIX }}
          --include-package=holodori_profile_export
          --include-package-data=holodori_profile_export
          --include-package-data=curl_cffi
          --include-package-data=customtkinter
          --company-name=HolodoriDB
          --product-name="holodori exporter"
          --file-version=${{ steps.ver.outputs.version }}
          --product-version=${{ steps.ver.outputs.version }}
          main.py

      # Each download is a zip named holodori-exporter-<os>.zip holding the app named "holodori exporter".
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d dist/*.app | head -n1)
          target="dist/holodori exporter.app"
          [ "$app" = "$target" ] || mv "$app" "$target"
          # A .app is a folder; zip it with ditto so it keeps its permissions and still opens after download
          ditto -c -k --keepParent "$target" dist/holodori-exporter-macos.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          $exe = Get-ChildItem dist -File -Filter "holodori-exporter-windows*" | Select-Object -First 1
          Move-Item $exe.FullName "pkg/holodori exporter.exe"
          Compress-Archive -Path "pkg/holodori exporter.exe" -DestinationPath dist/holodori-exporter-windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p pkg
          mv dist/holodori-exporter-linux "pkg/holodori exporter"
          chmod +x "pkg/holodori exporter"
          (cd pkg && zip -X ../dist/holodori-exporter-linux.zip "holodori exporter")

      - uses: actions/upload-artifact@v4
        with:
          name: holodori-exporter-${{ matrix.os }}
          path: dist/holodori-exporter-*.zip
          if-no-files-found: error

  # Pushing a tag like v1.1.1 publishes the builds as a GitHub release anyone can download.
  # Running the workflow by hand with release_tag set attaches the builds to that existing release.
  # always(): still publish the builds that succeeded if one OS had no runner (macOS can queue out).
  release:
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # the release may already exist if it was made on github.com; then just add the files
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
          || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
